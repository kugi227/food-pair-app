<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Pair Navi</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <header class="header">
    <div class="header-inner">
      <h1>Food Pair Navi</h1>
      <p class="subtitle">食材の組み合わせを最適化して、毎日の食事をもっと健康に。</p>
    </div>
  </header>

  <main class="container">

    <section class="section search-section">
      <h2>使いたい食材を選んでください</h2>

      <div class="food-search-wrapper" id="foodSearchWrapper">
        <div class="search-controls">
          <input
            type="text"
            id="foodSearch"
            class="food-search-input"
            placeholder="クリックして食材を選ぶ"
            autocomplete="off"
          >
        </div>

        <div class="selected-food-chip" id="selectedFoodChip" hidden>
          <span id="selectedFoodChipText"></span>
          <button type="button" id="clearSelectedFood" class="selected-food-clear">×</button>
        </div>

        <div id="foodCandidatePanel" class="food-candidate-panel" aria-hidden="true">
          <div id="foodCategoryTabs" class="food-category-tabs"></div>
          <div id="searchSubOptions" class="search-sub-options"></div>
          <div id="searchResults" class="search-results"></div>
        </div>
      </div>
    </section>

    <section class="result-wrapper" id="resultContainer">

      <div id="logicBox" class="logic-box-container">

        <div class="card-header-main">
          <div class="result-icon-circle" id="resultStatusIcon">◎</div>
          <h3 id="cardTitle">相乗効果</h3>
        </div>

        <div class="pair-tabs" id="pairTabs">
          <button type="button" class="rating-btn active" data-rank="0">◎ 最強</button>
          <button type="button" class="rating-btn" data-rank="1">○ 良好</button>
          <button type="button" class="rating-btn" data-rank="2">△ 普通</button>
        </div>

        <div class="result-main-layout">

          <div class="food-display">
            <span id="foodEmojiDisplay"></span>
            <p id="foodNameLabel"></p>
          </div>

          <div class="chart-score-column">
            <div class="chart-box">
              <canvas id="radarChart"></canvas>
            </div>

            <div class="slider-container-box" style="margin: 15px 0; padding: 10px; background: rgba(0,0,0,0.02); border-radius: 8px;">
              <p class="slider-section-title" style="margin: 0 0 8px 0; font-size: 13px; font-weight: bold; color: #666;">✨ リアルタイム・カスタマイズ</p>
              
              <div class="slider-row" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-size: 13px;">
                <span class="slider-label" id="volumeSliderLabel" style="width: 70px;">量（通常）</span>
                <input type="range" id="volumeSlider" min="1" max="2" value="1" style="flex: 1; margin: 0 10px;">
                <span class="slider-value-text" id="volumeSliderValue" style="width: 35px; text-align: right;">1倍</span>
              </div>

              <div class="slider-row" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-size: 13px;">
                <span class="slider-label" style="width: 70px;">野菜の量</span>
                <input type="range" id="vegSlider" min="1" max="3" value="1" style="flex: 1; margin: 0 10px;">
                <span class="slider-value-text" id="vegSliderValue" style="width: 35px; text-align: right;">通常</span>
              </div>

              <div class="slider-row" style="display: flex; align-items: center; justify-content: space-between; font-size: 13px;">
                <span class="slider-label" style="width: 70px;">調味料</span>
                <input type="range" id="condimentSlider" min="0" max="3" value="0" style="flex: 1; margin: 0 10px;">
                <span class="slider-value-text" id="condimentSliderValue" style="width: 35px; text-align: right;">なし</span>
              </div>
            </div>

            <div class="score-display-row">
              <div class="score-main-val">
                栄養スコア：<span id="nutritionScore">-</span>
              </div>
              <div class="boost-val-sub">
                (<span id="boostRate">+0%</span> ブースト)
              </div>
            </div>
          </div>

        </div>

        <div class="logic-content-area" id="bestLogicArea">
          <div class="best-logic-tag">🏆 最強ロジック</div>
          <h4 id="bestMethodTitle" class="logic-title-text"></h4>
          <p id="scientificEvidence" class="logic-description"></p>
        </div>

      </div>

      <div class="detail-info-section">
        <div class="info-item">
          <strong>❓ 理由：</strong>
          <span id="reason"></span>
        </div>

        <div class="info-item">
          <strong>💡 改善提案：</strong>
          <span id="improvement"></span>
        </div>

        <div class="info-item">
          <strong>💧 おすすめドレッシング：</strong>
          <ul id="dressingList" class="horizontal-list"></ul>
        </div>
      </div>

    </section>

    <section class="notice-box">
      <div class="notice-icon">i</div>
      <div>
        <p>本サービスは一般的な情報提供を目的としています。特定の疾患の治療・予防を目的とするものではありません。</p>
      </div>
    </section>

  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
