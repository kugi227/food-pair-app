<section class="section">
  <h2>使いたい食材を検索してください</h2>

  <div class="search-area">
    <input
      type="text"
      id="foodSearch"
      class="food-search-input"
      placeholder="例：納豆、トマト、卵"
      autocomplete="off"
    >

    <button id="searchOkButton" class="search-ok-button">
      OK
    </button>
  </div>

  <div id="searchResults" class="search-results"></div>
</section>
